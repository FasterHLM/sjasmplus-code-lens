<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Telegram avatar of sjasmplus Code Lens: the extension icon laid out for a circular crop.
       Full-bleed square (Telegram crops it to the inscribed circle); content stays inside the circle. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1d24"/>
      <stop offset="1" stop-color="#0c0c10"/>
    </linearGradient>
    <clipPath id="circle"><circle cx="256" cy="256" r="256"/></clipPath>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- four diagonal stripes across the lower right of the circle (x + y = const lines) -->
  <g clip-path="url(#circle)">
    <polygon fill="#e8322b" points="168,512 512,168 512,216 216,512"/>
    <polygon fill="#f6d31c" points="216,512 512,216 512,264 264,512"/>
    <polygon fill="#2fb84f" points="264,512 512,264 512,312 312,512"/>
    <polygon fill="#22b8e0" points="312,512 512,312 512,512"/>
  </g>

  <!-- faint rim so the edge stays visible on Telegram's dark background -->
  <circle cx="256" cy="256" r="251" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="4"/>

  <!-- the code lens of the extension icon, scaled and moved into the circle -->
  <g transform="translate(57 46.6) scale(1.6)">
    <!-- reference-count badge -->
    <rect x="40" y="34" width="72" height="42" rx="21" fill="#22b8e0"/>
    <path transform="translate(76 55)" d="M-8 -13 H8 L-1 -3 A8 8 0 1 1 -7.2 9.2"
          fill="none" stroke="#0c0c10" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- label: -->
    <rect x="40" y="94" width="128" height="28" rx="6" fill="#f5f5f5"/>
    <rect x="178" y="95" width="11" height="11" rx="2" fill="#f5f5f5"/>
    <rect x="178" y="111" width="11" height="11" rx="2" fill="#f5f5f5"/>
    <!-- indented instructions -->
    <rect x="72" y="142" width="96" height="24" rx="6" fill="#8b90a0"/>
    <rect x="72" y="184" width="56" height="24" rx="6" fill="#8b90a0"/>
  </g>
</svg>
